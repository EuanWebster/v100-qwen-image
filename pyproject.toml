[build-system]
# Pinned exactly to the setuptools version used and tested for this build
# (84.0.0, verified in the uv build environment), not a floating floor.
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-engine"
version = "0.1.0"
description = "Hand-rolled Qwen-Image-2.1 generation engine for a Tesla V100 16GB (CPU-only core; heavy ML imports deferred to adapters)"
requires-python = ">=3.11"
# license intentionally unset: no license has been selected yet — do not
# claim MIT (or anything else) until the human chooses one.
dependencies = []

[project.scripts]
qwen-engine = "qwen_engine.cli:main"
qwen-web = "qwen_engine.web.server:main"
qwen-encoder-worker = "qwen_engine.encoder_worker:main"

[tool.setuptools.packages.find]
where = ["src"]
# Real packages only: web_static stays a DATA directory (never a namespace
# package, never importable), shipped through the package-data map below.
include = ["qwen_engine*"]
namespaces = false

[tool.setuptools.package-data]
# Fixed static web workspace shipped inside the qwen_engine package and
# served via a fixed importlib.resources allowlist map (W2 server).
qwen_engine = ["web_static/index.html", "web_static/app.css", "web_static/app.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]
